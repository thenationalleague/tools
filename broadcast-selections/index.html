<!DOCTYPE html>
<!--
  NL Tools — Broadcast selections (public standalone page)
  File: /broadcast-selections/index.html
  v2.16 (06/09/2026)

  v2.16 (06/09/2026) — Home state cut: the venue switcher is Away /
  Both. Both keeps home games dimmed on the map and summed in the
  table; Home's lone fact is Moved minus Away.

  v2.15 (06/09/2026) — Venue switcher relocates to the strip above the
  map, beside the unpicked toggle and Viewing chip.

  v2.14 (06/09/2026) — Venue switcher gains Both and now drives the
  club-lens map and its unpicked games as well as the table slots; the
  by-club crests sit in a fixed box so names align.

  v2.13 (06/09/2026) — Fabric treks in division colours, thicker and
  stronger; fabric selections and mile chips follow suit.

  v2.12 (06/09/2026) — The tab drives the whole stage. Full season: the
  map becomes the fabric (every pick for the toggled league, dots not
  pills, tap a trek for its card). By club: tap a row for that club's
  season — away treks bold, home moved dimmed, unpicked toggle scoped to
  them, Viewing chip to clear. Week by week unchanged. Base tooltip
  clarified (all fixtures, midweek included).

  v2.11 (06/09/2026) — Band marks keep their original artwork (only the
  PL lion goes white); band lettering white on all five colours.

  v2.10 (06/09/2026) — By-club slot counts gain a Home/Away switcher,
  away the default. Both venues are tallied; the switcher picks which
  set the slot columns show. The mileage trio stays away-only: home
  trips have no miles.

  v2.9 (06/09/2026) — By club rebuilt around fairness: Base (the mean
  away trip a club's fixture list owes it) beside its mean moved trip,
  with "vs base" as the default sort — geography stops counting against
  the broadcaster. Means only in this tab. Off-Sat replaced by batched
  slot counts (Fri / Sat early / Sat late / Sun / Mon, either venue);
  a lens only shows slots that occur in it.

  v2.8 (06/09/2026) — Week-by-week band headers wear the division colour
  with logo and full league name.

  v2.7 (06/09/2026) — By club: average miles replaces total (the mean
  trip beside the median — total rewarded simply being away more), and
  rows carry club crests from /assets/crests/thumbs/ (all 116 covered;
  one alias, Bournemouth → AFC Bournemouth).

  v2.6 (06/09/2026) — Third tab: By club, the brunt table. One row per
  club of the toggled league(s), zero-pick clubs included; Moved / Away /
  Away mi / Med trip / Off-Sat columns, default sort total away miles
  descending (miles land on the away side only; Off-Sat counts Fri/Sun/
  Mon either venue). Tap a header to re-sort. Same freeze panes as the
  weekly table.

  v2.5 (06/09/2026) — Unpicked treks darken: same weight and opacity as
  picked ones but ink instead of red, home dots ink too. Colour alone
  now says picked/not-picked.

  v2.4 (06/09/2026) — Week-by-week "Moved" column header shortened to "G"
  (hover title "Games moved") to save width, per Richard.

  v2.3 (06/09/2026) — NEXT UP opponents by full name ("Preston North End",
  "Atlético Madrid"), per Richard — the feeds' short forms and codes read
  as jargon next to the club's own three-letter code. Data-only: all four
  sources now pass the full name into the events feed.

  v2.2 (06/09/2026) — EFL three-letter codes restored in NEXT UP. v2.1's
  data refresh was rebuilt once more for stats and the EFL code patch was
  not re-run after it, so 72 clubs shipped with i:null and every EFL card
  read "null Peterborough (H)". The pipeline now runs the patch itself at
  the end of build-data, and both page builders refuse data containing
  null codes, so the step can no longer be skipped.

  v2.1 (05/09/2026) — Unpicked games on demand, and Europe in NEXT UP.
  A toggle under the weekend strip adds the rest of the round — every
  weekend league game not picked (1,767 across the season; picked +
  unpicked partitions the round-context count exactly, build-checked) —
  as small grey dots and faint treks on the map and dimmed compact cards
  under a "Not selected" rule, division-grouped like the picks. PL clubs'
  NEXT UP lines now include UCL/UEL/UECL ties (Pulselive comps 2/3/2247,
  2026/2027 compSeasons resolved live), marked with the cup treatment.
  Data snapshot refreshed 05/09/2026 (302 picks, NL 84, unchanged).

  v2.0 (05/09/2026) — Retitled "Broadcast Travel", and three fixes from
  first real use on a phone. (1) The gate script now lands after the page
  markup — it used to splice in at the first closing script tag, before
  #bselGate existed, so NL.codeGate fell back to document.body, wiped the
  page while the code was being typed, and the reveal step then crashed:
  a first code entry hung at "Checking…" until a manual reload. The same
  splice also left the body/html close tags mid-document. (2) The
  audience name and sign-out now live in the topbar itself (extras.right,
  re-rendered on grant) — the separate .nl-idbar strip under the title is
  gone. (3) Freeze panes on both tables: header rows and the Weekend /
  Division column stay pinned while the table scrolls (sticky on cells,
  not thead — Chromium ignores row-group sticky; border-collapse goes
  separate so borders travel with stuck cells).

  v1.9 (05/09/2026) — Access gate. The hosted page sits behind the estate's
  code gate: NL.codeGate.ensure with viaFunction against
  app-data/pub-broadcast-selections, resumed on the bsel claim, codes held
  server-side per audience (functions/broadcast-selections.js — the
  uw-promo/programme/club-code family shape). The page renders hidden and
  reveals on a grant, with an .nl-idbar naming the audience and a sign-out.
  The artifact build stays ungated. Also: with All leagues selected, cards
  group by division (PL, CH, L1, L2, NL), kick-off order within each.

  v1.8 (04/09/2026) — August corrected, per Richard: the NL round moved
  for broadcast (the one the fee was paid for) was the whole-division
  12:30 on Sat 22 Aug, not the Thu 27/Fri 28 bundle previously decreed
  into w/e 29 Aug. Twelve out, twelve in — NL stays exactly 84, and its
  first moved weekend is now w/e 22 Aug.

  v1.7 (04/09/2026) — The table title line is cut: the tabs already say
  what is shown. (An NL full-rounds discount toggle was built and removed
  the same day — offering to discount those weekends argued the wrong
  thing. For the record it barely mattered: +40% median vs baseline with
  them counted, +39% without.)

  v1.6 (04/09/2026) — Touch. Hover wiring attaches only on hover-capable
  devices; on narrow screens the map is sticky and compact (42vh) so a
  tapped card's trek highlight stays in view; tapping a pill or the route
  line itself (fat invisible hit area) selects the game and glides its
  glowing card into view.

  v1.5 (04/09/2026) — Density. The intro line is gone; page and table
  padding tighten; the map column slims; cards run two columns on wide
  screens; the week scrollbox grows with the viewport. The .page padding
  override joins the profile hide as a tracked canon override.

  v1.4 (04/09/2026) — Full-width: the canon .page container (1700px, fluid
  padding) replaces the bespoke 1080px wrapper; the map column scales with
  the viewport. Card selection/hover tints and glows in the division's own
  colour instead of a red outline over the identity border.

  v1.3 (04/09/2026) — Round context. The inlined data gains RND (per
  division per weekend, median/mean over ALL games played, same weekend
  bucketing as the moved set) and Week by week gains a "vs rnd" column
  per league: the moved games' median against the weekend's full round.
  Near 0% = the mileage was the weekend's pairings, not the picking.

  v1.2 (04/09/2026) — Full canon furniture: the real nl-topbar carries the
  title (rendered sessionless via NL.renderTopbar(null); the profile
  cluster is hidden — canon candidate: nl-topbar wants a public option),
  the league switcher is a canon .chip-group, the mode switcher canon
  .tabs, tables sit in canon .table-wrap, and every font size is on the
  --text-* scale with weights carrying font-variation-settings; radii,
  tracking and focus rings from brand tokens. The bespoke masthead is
  gone. NL_TOOL + NL_CHANGELOG declared per convention.

  v1.1 (04/09/2026) — Canon-native: the page-local token aliases (--paper,
  --ink, --wire and friends) are gone — this page now speaks nl-brand.css
  tokens directly, keeping only three cartographic one-offs for the map.
  Competition marks added (SVGs in /assets/competitions/ + the NL badge
  already in /assets/divisions/) with identity colours sampled from the
  artwork; cards carry a logo panel and a division-coloured left border.
  Weekend labels are the Saturday's date alone, and switching league keeps
  the selected weekend.

  v1.0 (04/09/2026) — First hosted version. The "Travel for broadcast
  fixtures" analysis restyled into the NL brand (carbona + tokens via
  /system/nl-brand.css) as a public standalone page: no auth-guard, by
  design — it exists to be handed to people outside the portal. noindex
  and linked from nowhere, so it is reachable only by URL. Data is a
  static snapshot (built 04/09/2026) inlined in the script block; refresh
  means re-running the build pipeline against the live PL/EFL/NLS feeds
  and recommitting this file. Behaviour iterated as a Claude artifact
  (v1.x-v3.0); both tables always show every division, the league
  switcher over the map scopes only the map, strip and match cards.

  Light theme only: the artifact's dark-mode blocks were dropped — the
  brand sheet is light-first and a public brand page commits to that look.
-->

  <script src="/system/nl-topbar.js?v=10"></script>
  <style>

  :root {
    /* Cartographic one-offs — the only page-local colours. Everything
       else on this page speaks nl-brand.css tokens directly. */
    --land: #e3e8e0;
    --coast: #b9c4b6;
    --sea-grid: #e2e7ee;
  }

  body { background: var(--off-white); color: var(--text); font-family: var(--font); margin: 0; padding: 0; }
  /* Hosted-page furniture — inert in the artifact, which has no topbar.
     Both rules are tracked canon overrides: the profile cluster is auth
     furniture on a sessionless page, and the container padding tightens
     for a data-dense page (source-order override, per the brand doc). */
  #nlTopbar .topbar__profile { display: none; }
  .page { padding-top: 14px; padding-bottom: 44px; }
  /* Audience + sign-out, rendered into the topbar's extras.right slot on a
     grant (hosted only — the artifact has no gate, so these match nothing).
     Ground is the topbar's --primary; mixes follow nl-topbar's own pattern. */
  #bselTopRight { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  #bselWho { color: color-mix(in srgb, var(--white) 75%, var(--primary)); font-size: var(--text-xs); font-weight: 700; font-variation-settings: 'wght' 700; text-transform: uppercase; letter-spacing: var(--tracking-wide); white-space: nowrap; }
  #bselOut { background: none; border: 1px solid color-mix(in srgb, var(--white) 35%, var(--primary)); color: var(--white); border-radius: var(--radius-sm); padding: 5px 12px; font-family: var(--font); font-size: var(--text-xs); font-weight: 700; font-variation-settings: 'wght' 700; letter-spacing: var(--tracking-wide); cursor: pointer; white-space: nowrap; }
  #bselOut:hover { border-color: var(--white); }
  @media (max-width: 520px) { #bselWho { display: none; } }
  header h1 { font-size: var(--text-lg); font-weight: 900; font-variation-settings: 'wght' 900; letter-spacing: -0.02em; margin: 0 0 14px; text-wrap: balance; }

  #divbar { flex-wrap: wrap; margin-bottom: 8px; }
  #divbar > button { display: inline-flex; align-items: center; gap: 6px; }
  #divbar .plg { height: 15px; width: auto; }
  .avgs td .dlg { height: 15px; width: auto; vertical-align: -2px; margin-right: 7px; }
  #divbar > button:focus-visible, .gwbar button:focus-visible { outline: none; box-shadow: var(--focus-ring); }

  /* Weekend strip: a justified one-off, not a .chip-group — an unbounded,
     scrolling set of dated pills carrying counts. Sizes from the scale. */
  .gwbar { display: flex; gap: 6px; margin: 0 0 10px; flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; }
  .gwbar button {
    flex: 0 0 auto; white-space: nowrap;
    font: inherit; font-weight: 600; font-variation-settings: 'wght' 600; font-size: var(--text-sm); color: var(--text);
    background: var(--white); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 5px 10px; cursor: pointer; line-height: 1.3;
  }
  .gwbar button small { font-weight: 400; color: var(--text-muted); font-size: var(--text-xs); margin-left: 4px; }
  .gwbar button.zero { opacity: 0.5; }
  .gwbar { cursor: grab; user-select: none; }
  .gwbar button[aria-pressed="true"] { background: var(--navy); color: var(--white); border-color: var(--navy); }
  .gwbar button[aria-pressed="true"] small { color: var(--white); opacity: 0.75; }

  #upbar { margin: -2px 0 10px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  #lensChip { display: inline-flex; align-items: center; gap: 7px; background: var(--text); color: var(--off-white); border-radius: 999px; font-size: var(--text-xs); font-weight: 700; font-variation-settings: 'wght' 700; letter-spacing: var(--tracking-wide); text-transform: uppercase; padding: 5px 7px 5px 12px; }
  #lensChip[hidden] { display: none; }
  #lensChip button { appearance: none; background: none; border: none; color: var(--off-white); font: inherit; cursor: pointer; padding: 0 4px; opacity: 0.8; }
  #lensChip button:hover { opacity: 1; }
  #upbar button { appearance: none; background: var(--white); border: 1px solid var(--border); border-radius: 999px; color: var(--text-muted); font-family: var(--font); font-size: var(--text-xs); font-weight: 700; font-variation-settings: 'wght' 700; letter-spacing: var(--tracking-wide); text-transform: uppercase; padding: 5px 12px; cursor: pointer; }
  #upbar button[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: var(--off-white); }
  #upbar button:focus-visible { outline: none; box-shadow: var(--focus-ring); }

  .stage { display: grid; grid-template-columns: clamp(380px, 34vw, 540px) minmax(0, 1fr); gap: clamp(16px, 1.5vw, 28px); align-items: start; }
  @media (max-width: 840px) {
    .stage { grid-template-columns: 1fr; }
    /* Phone: the map rides sticky and compact so tapping a card shows its
       trek highlight without scrolling away from the cards. */
    .mapbox { position: sticky; top: 0; z-index: 2; }
    .mapbox svg { height: 42vh; width: auto; max-width: 100%; margin: 0 auto; }
  }

  .tbltop { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin: 0 0 8px; }
  #modebar { margin-bottom: 0; }
  #modebar > button { flex: 0 0 auto; }
  .headline { margin-bottom: 10px; }

  .mapbox { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 10px; }
  .mapbox svg { display: block; width: 100%; height: auto; }

  .rows { display: flex; flex-direction: column; gap: 5px; }
  /* Wide screens: two card columns, so a whole weekend fits on a 1080-tall
     viewport instead of scrolling a single stack. (Must follow the base
     .rows rule — equal specificity, source order decides.) */
  @media (min-width: 1400px) { .rows { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-items: start; } }
  .row.up { opacity: 0.62; }
  .row.up.active { opacity: 1; }
  .uphead { font-size: var(--text-xs); font-weight: 700; font-variation-settings: 'wght' 700; letter-spacing: var(--tracking-wider); text-transform: uppercase; color: var(--text-muted); border-top: 1px dashed var(--border); padding-top: 10px; margin-top: 6px; grid-column: 1 / -1; }
  .row {
    display: flex; align-items: stretch; gap: 9px;
    background: var(--white); border: 1px solid var(--border);
    border-left: 3px solid var(--dcol, var(--border)); border-radius: var(--radius);
    padding: 6px 9px; cursor: pointer;
  }
  .row .lg { flex: 0 0 36px; display: flex; align-items: center; justify-content: center; }
  .row .lg img { max-width: 36px; max-height: 42px; }
  .row .rbody { flex: 1; min-width: 0; }
  /* Selection keeps the division's identity: a tint of its own colour and
     a soft glow, never an outline that overrides the left border. */
  .row.active {
    background: color-mix(in srgb, var(--dcol, var(--border)) 8%, var(--white));
    border-color: color-mix(in srgb, var(--dcol, var(--border)) 45%, var(--border));
    border-left-color: var(--dcol, var(--border));
    box-shadow: 0 2px 12px color-mix(in srgb, var(--dcol, var(--border)) 30%, transparent);
  }
  .row .when { font-size: var(--text-xs); color: var(--text-muted); line-height: 1.4; margin-bottom: 2px; }
  .row .when b { color: var(--text); font-weight: 600; font-variation-settings: 'wght' 600; }
  .row .tieline { display: flex; align-items: baseline; gap: 8px; }
  .row .tie { flex: 1; min-width: 0; font-size: var(--text-base); font-weight: 600; font-variation-settings: 'wght' 600; line-height: 1.35; }
  .row .tie span { color: var(--text-muted); font-weight: 400; font-variation-settings: 'wght' 400; }
  .row .mi { font-size: var(--text-sm); font-weight: 600; font-variation-settings: 'wght' 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .row .next {
    display: flex; align-items: stretch; gap: 10px;
    font-size: var(--text-xs); color: var(--text-muted); line-height: 1.6;
    border-top: 1px dashed var(--border); padding-top: 5px; margin-top: 2px;
  }
  .row .next .nlab { display: flex; align-items: center; font-size: var(--text-xs); font-weight: 700; font-variation-settings: 'wght' 700; letter-spacing: var(--tracking-wide); text-transform: uppercase; border-right: 1px solid var(--border); padding-right: 10px; }
  .row .next .nlines { flex: 1; min-width: 0; }
  .row .next b { color: var(--text); font-weight: 600; font-variation-settings: 'wght' 600; }
  .row .next .cup { color: var(--primary); font-weight: 600; }

  .avgs { margin-top: 10px; }
  .avgs h2 { font-size: var(--text-xs); font-weight: 700; font-variation-settings: 'wght' 700; letter-spacing: var(--tracking-wider); text-transform: uppercase; color: var(--text-muted); margin: 0 0 8px; }
  /* Two rules serve the freeze panes below: border-collapse must be separate
     (collapsed borders are painted by the table and stay behind when a stuck
     cell moves), and the table itself must NOT carry overflow: hidden — any
     overflow other than visible makes an element the sticky scrollport, which
     would trap the stuck cells on the non-scrolling table. The border and
     radius live on the scroll wrappers instead. */
  .avgs table { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--white); font-size: var(--text-sm); }
  .avgs th, .avgs td { padding: 5px 10px; text-align: right; font-variant-numeric: tabular-nums; }
  .avgs th:first-child, .avgs td:first-child { text-align: left; }
  .avgs thead th { color: var(--text-muted); font-weight: 800; font-variation-settings: 'wght' 800; font-size: var(--text-xs); letter-spacing: var(--tracking-tight); text-transform: uppercase; border-bottom: 1px solid var(--border); }
  .avgs tbody tr + tr td { border-top: 1px solid var(--border); }
  .avgs td:first-child { font-weight: 600; font-variation-settings: 'wght' 600; }
  .avgs thead th.band { text-align: center; border-left: 1px solid var(--border); }
  #divTable thead tr:nth-child(2) th { text-align: right; }
  #divTable thead tr:nth-child(2) th:nth-child(1),
  #divTable thead tr:nth-child(2) th:nth-child(3),
  #divTable thead tr:nth-child(2) th:nth-child(5),
  #divTable tbody td:nth-child(5), #divTable tbody td:nth-child(7), #divTable tbody td:nth-child(9) { border-left: 1px solid var(--border); }
  #divWrap, #weekWrap { border: 1px solid var(--border); border-radius: var(--radius-lg); }
  .avgs .scrollbox { max-height: clamp(320px, 46vh, 620px); overflow-y: auto; }
  /* Freeze panes. Sticky sits on the CELLS — Chromium ignores position:
     sticky on thead/tr, which is why a sticky-thead rule did nothing on
     phones. The two header rows pin to the scrollbox top (the band row's
     height is fixed so the second row knows its offset); the Weekend /
     Division column pins left. The vertical seam is a box-shadow, not a
     border-right: it paints on the same pixel as the following cell's
     .bl border at rest, and travels with the stuck cell when scrolled. */
  /* The 30px here and the second row's top must agree: the band row is
     pinned to that height so the row beneath knows its offset. */
  #weekTable thead th { position: sticky; top: 0; z-index: 2; background: var(--white); white-space: nowrap; }
  #weekTable thead tr:first-child th { height: 30px; box-sizing: border-box; padding-top: 0; padding-bottom: 0; vertical-align: middle; }
  #weekTable thead tr:nth-child(2) th { top: 30px; }
  #weekTable tbody td:first-child, #divTable tbody td:first-child, #clubTable tbody td:first-child {
    position: sticky; left: 0; z-index: 1; background: var(--white);
    white-space: nowrap; box-shadow: 1px 0 0 var(--border);
  }
  #weekTable thead tr:first-child th:first-child, #divTable thead tr:first-child th:first-child, #clubTable thead tr:first-child th:first-child {
    position: sticky; left: 0; z-index: 3; background: var(--white); box-shadow: 1px 0 0 var(--border);
  }
  #clubTable thead th { position: sticky; top: 0; z-index: 2; background: var(--white); white-space: nowrap; cursor: pointer; user-select: none; }
  #clubTable thead th.sorted { color: var(--text); }
  #haBar { display: flex; gap: 6px; }
  #haBar[hidden] { display: none; }
  #haBar button { appearance: none; background: var(--white); border: 1px solid var(--border); border-radius: 999px; color: var(--text-muted); font-family: var(--font); font-size: var(--text-xs); font-weight: 700; font-variation-settings: 'wght' 700; letter-spacing: var(--tracking-wide); text-transform: uppercase; padding: 5px 12px; cursor: pointer; }
  #haBar button[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: var(--off-white); }
  #haBar button:focus-visible { outline: none; box-shadow: var(--focus-ring); }
  #clubTable tbody tr { cursor: pointer; }
  /* Crests vary in shape; a fixed box keeps every club name on one rail. */
  #clubTable td .dlg { width: 22px; height: 16px; object-fit: contain; vertical-align: -3px; margin-right: 7px; }
  #clubTable tbody tr.lensed td { background: color-mix(in srgb, var(--primary) 8%, var(--white)); }
  #weekTable tbody tr { cursor: pointer; }
  #weekTable tr.now td:first-child { color: var(--primary); }
  #weekTable th, #weekTable td { padding: 6px 8px; }
  #weekTable thead tr:nth-child(2) th { text-align: right; }
  #weekTable .bl { border-left: 1px solid var(--border); }
  #weekTable .bandlogo { height: 15px; width: auto; vertical-align: -3px; margin-right: 6px; }
  #weekTable .bandlogo--pl { filter: brightness(0) invert(1); }
  #weekTable .dim { color: var(--text-muted); }
  #weekTable tr.mt td { color: var(--text-muted); }
  #modebar > button:focus-visible { outline: none; box-shadow: var(--focus-ring); }

  text.moniker { font-family: var(--font); font-weight: 700; font-variation-settings: 'wght' 700; }
  .mchip { font-family: var(--font); font-weight: 600; font-variation-settings: 'wght' 600; font-variant-numeric: tabular-nums; }
</style>

/* Green (short, friendly) to red (long) — an alpha tint that works on
   both theme grounds. Scaled to the values actually on show. */
const heat = (v, lo, hi) => {
  if (hi <= lo) return "";
  const t = Math.min(1, Math.max(0, (v - lo) / (hi - lo)));
  return "background:hsla(" + Math.round(140 - 132 * t) + ",65%,45%,0.22)";
};
const heatPct = d => heat(Math.min(50, Math.max(-50, d)), -50, 50);

/* Touch: attach hover wiring only where hover exists — tap-emulated
   mouseenter re-rendered the card mid-tap and made selection misfire. */
const HOVERABLE = window.matchMedia("(hover: hover)").matches;
function selectFx(i, fromMap) {
  activeFx = (activeFx === i ? -1 : i);

function fmtNext(name, n) {
  const ab = CLUBS[name].i;
  if (!n) return "<div><b>" + ab + "</b> — no game in window</div>";
  return "<div title=\"" + n.w + "\"><b>" + ab + "</b> " + n.o + " (" + n.ha + "), " +
    n.d + "d" + (n.c ? ' <span class="cup">(' + n.c + ')</span>' : "") + "</div>";
}
function mean(a) { return a.reduce((s, v) => s + v, 0) / a.length; }
function median(a) { const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; }

/* By club — who gets the brunt. One row per club of the toggled league(s),
   zero-pick clubs included (an untouched club is part of the spread). Miles
   land on the AWAY side only, and means throughout — per-club samples are a
   handful of trips, and a mean compares cleanly with the club's own
   baseline: the mean away trip its fixture list already owes it (distance
   to every divisional rival — pure geography). "vs base" is the honest
   burden column and the default sort: a far-flung club whose moved trips
   match its normal trips reads near 0%. Slot columns count games either
   venue (a Friday home game still takes the Saturday), batched so a rogue
   kick-off folds into its batch, and a lens only shows slots it uses. */
const SLOTS = [
  ["fri", "Fri", "Friday", f => f.day.startsWith("Fri")],
  ["satE", "Sat E", "Saturday before 3pm", f => f.day.startsWith("Sat") && f.t < "15:00"],
  ["satL", "Sat L", "Saturday after 3pm", f => f.day.startsWith("Sat") && f.t > "15:00"],
  ["sun", "Sun", "Sunday", f => f.day.startsWith("Sun")],
  ["mon", "Mon", "Monday", f => f.day.startsWith("Mon")]
];
const havMi = (a, b) => { const t = x => x * Math.PI / 180;
  const h = Math.sin(t(b.lat - a.lat) / 2) ** 2 + Math.cos(t(a.lat)) * Math.cos(t(b.lat)) * Math.sin(t(b.lng - a.lng) / 2) ** 2;
  return 2 * 6371e3 * Math.asin(Math.sqrt(h)) / 1609.344; };
function renderClubTable() {
  const agg = {};
  for (const name in CLUBS) {
    const c = CLUBS[name];
    if (divSel === "ALL" || c.div === divSel)
      agg[name] = { name, div: c.div, moved: 0, away: 0, trips: [],
        a_fri: 0, a_satE: 0, a_satL: 0, a_sun: 0, a_mon: 0,
        h_fri: 0, h_satE: 0, h_satL: 0, h_sun: 0, h_mon: 0 };
  }
  FX.forEach(f => {
    const slot = SLOTS.find(s => s[3](f));
    for (const [name, isAway] of [[f.h, false], [f.a, true]]) {
      const c = agg[name]; if (!c) continue;
      c.moved++;
      if (isAway) { c.away++; c.trips.push(f.mi); }
      /* Both venues tallied; the Home/Away switcher picks which set the
         slot columns show. Away slot sums = Away; home = Moved - Away. */
      if (slot) c[(isAway ? "a_" : "h_") + slot[0]]++;
    }
  });
  const rows = Object.values(agg);
  rows.forEach(r => {
    /* Baseline: a double round-robin visits every divisional rival once,
       so the club's normal away trip is its mean distance to them. */
    const others = Object.values(CLUBS).filter(c => c.div === r.div && c !== CLUBS[r.name]);
    r.base = Math.round(mean(others.map(c => havMi(CLUBS[r.name], c))));
    r.avgMi = r.trips.length ? Math.round(mean(r.trips)) : null;
    r.vsBase = r.avgMi === null ? null : Math.round((r.avgMi - r.base) / r.base * 100);
  });
  const slotKeys = new Set(SLOTS.map(s => s[0]));
  const slotOf = (r, k) => clubHA === "both" ? r["a_" + k] + r["h_" + k] : r["a_" + k];
  const val = (r, k) => {
    if (k === "name") return r.name;
    const v = slotKeys.has(k) ? slotOf(r, k) : r[k];
    return v === null ? -999 : v;
  };
  rows.sort((a, b) => {
    const x = val(a, clubSort.k), y = val(b, clubSort.k);
    const c = (typeof x === "string") ? x.localeCompare(y) : x - y;
    return c ? c * clubSort.d : a.name.localeCompare(b.name);
  });
  const scale = k => {
    const vs = rows.filter(r => r[k] !== null).map(r => r[k]);
    return vs.length ? [Math.min(...vs), Math.max(...vs)] : [0, 1];
  };
  const [avLo, avHi] = scale("avgMi"), [bsLo, bsHi] = scale("base");
  const liveSlots = SLOTS.filter(s => rows.some(r => slotOf(r, s[0]) > 0));
  const slotHi = Object.fromEntries(liveSlots.map(s => [s[0], Math.max(1, ...rows.map(r => slotOf(r, s[0])))]));
  const COLS = [["name", "Club", ""], ["moved", "Moved", "Games moved (either venue)"],
    ["away", "Away", "Moved games travelled to"], ["avgMi", "Avg move", "Mean moved away trip"],
    ["base", "Base", "Mean away trip the fixture list owes them — every divisional rival once, midweek fixtures included"],
    ["vsBase", "vs base", "Moved trips against the club's own normal"],
    ...liveSlots.map(s => [s[0], s[1], s[2] + (clubHA === "both" ? " games, either venue" : " " + clubHA + " games")])];
  const mi = (v, lo, hi) => '</td><td style="' + (v === null ? "" : heat(v, lo, hi)) + '">' + (v === null ? "—" : v);
  const sign = v => (v >= 0 ? "+" : "") + v + "%";
  const ct = document.getElementById("clubTable");
  ct.innerHTML = "<thead><tr>" + COLS.map(([k, label, tip]) =>
    '<th data-k="' + k + '"' + (tip ? ' title="' + tip + '"' : "") +

  ).join("") + "</tr></thead><tbody>" + rows.map(r =>
    '<tr data-name="' + r.name.replace(/"/g, "&quot;") + '"' + (r.name === clubLens ? ' class="lensed"' : "") + "><td>" + crest(r.name, r.div) + r.name + "</td><td>" + r.moved + "</td><td>" + r.away +
    mi(r.avgMi, avLo, avHi) + mi(r.base, bsLo, bsHi) +
    '</td><td style="' + (r.vsBase === null ? "" : heatPct(r.vsBase)) + '">' + (r.vsBase === null ? "—" : sign(r.vsBase)) +
    liveSlots.map(s => { const v = slotOf(r, s[0]);

function render() {

      const mi = picks.map(f => f.mi);
      const wknds = new Set(picks.map(f => f.we)).size;
      return { k, n: mi.length, wknds, perW: mi.length / wknds,
        md: Math.round(median(mi)), m: Math.round(mean(mi)), b };
    }).filter(Boolean);
    const perWs = rows.map(r => r.perW);
    const pLo = Math.min(...perWs), pHi = Math.max(...perWs);
    let dh =
      "<thead><tr><th rowspan=2>Division</th><th rowspan=2>Picks</th><th rowspan=2>Wknds</th><th rowspan=2>Per wknd</th>" +
      '<th colspan=2 class="band">Season baseline mileage</th><th colspan=2 class="band">Broadcast pick mileage</th><th colspan=2 class="band">Broadcast difference</th></tr>' +
      "<tr><th>Median</th><th>Mean</th><th>Median</th><th>Mean</th><th>Median</th><th>Mean</th></tr></thead><tbody>";
    rows.forEach(r => {
      const dMed = pctN(r.md, r.b.med), dMean = pctN(r.m, r.b.mean);
      const sign = d => (d >= 0 ? "+" : "") + d + "%";
      dh += "<tr><td>" + dlogo(r.k, "dlg") + DIVS[r.k] + "</td><td>" + r.n + "</td><td>" + r.wknds +
        '</td><td style="' + heat(r.perW, pLo, pHi) + '">' + r.perW.toFixed(1) +
        "</td><td>" + r.b.med + "</td><td>" + r.b.mean + "</td><td>" + r.md + "</td><td>" + r.m +
        '</td><td style="' + heatPct(dMed) + '">' + sign(dMed) + '</td><td style="' + heatPct(dMean) + '">' + sign(dMean) + "</td></tr>";
    });
    dt.innerHTML = dh + "</tbody>";
  } else {
    /* Divisions side by side — per toggled league, in league order: games
       moved and the median trip that weekend. Each measure shades on one
       scale shared across the columns so leagues compare with each other,
       not just within themselves. */
    const wt = document.getElementById("weekTable");
    const divsOn = Object.keys(DIVS);
    const cell = list => {
      if (!list.length) return null;
      const mi = list.map(f => f.mi);
      return { n: list.length, md: Math.round(median(mi)), mn: Math.round(mean(mi)) };
    };
    const grid = allWeekends.map(we => ({
      we,
      per: divsOn.map(k => cell(FX.filter(f => f.we === we && f.div === k))),
      all: cell(FX.filter(f => f.we === we))
    }));
    const cells = grid.flatMap(r => r.per.filter(Boolean));
    const hiN = Math.max(...cells.map(c => c.n));
    const miles = cells.flatMap(c => [c.md, c.mn]);
    const mLo = Math.min(...miles), mHi = Math.max(...miles);
    /* Band headers wear the division's own colour, white lettering on all
       (Richard's call), and each mark keeps its original artwork — only
       the PL lion goes white, being the band's own purple otherwise. */
    let wh = "<thead><tr><th rowspan=2>Weekend</th>" +
      divsOn.map(k => '<th colspan=4 class="band" style="background:' + DIVMETA[k].col + ';color:var(--white)">' +
        dlogo(k, "bandlogo" + (k === "PL" ? " bandlogo--pl" : "")) + DIVS[k] + "</th>").join("") +
      '<th colspan=3 class="band">All</th></tr><tr>' +
      divsOn.map(() => '<th class=bl title="Games moved">G</th><th>Med mi</th><th>Mean mi</th><th>vs rnd</th>').join("") +
      '<th class=bl title="Games moved">G</th><th>Med mi</th><th>Mean mi</th></tr></thead><tbody>';
    /* vs rnd: the moved games' median against the median over ALL the
       division's games that weekend — near 0% means the mileage was the
       weekend's pairings, not the picking. */
    const signW = v => (v >= 0 ? "+" : "") + v + "%";
    const leagueBand = (c, k, we) => {
      if (!c) return "<td class=bl>—</td><td>—</td><td>—</td><td>—</td>";
      const rnd = (DATA.RND[k] || {})[we];
      const v = rnd ? Math.round((c.md - rnd.md) / rnd.md * 100) : null;
      return '<td class=bl style="' + heat(c.n, 0, hiN) + '">' + c.n +
        '</td><td style="' + heat(c.md, mLo, mHi) + '">' + c.md +
        '</td><td style="' + heat(c.mn, mLo, mHi) + '">' + c.mn +
        '</td><td style="' + (v === null ? "" : heatPct(v)) + '">' + (v === null ? "—" : signW(v)) + "</td>";
    };
    const allBand = c => c
      ? '<td class="bl dim">' + c.n + '</td><td class="dim">' + c.md + '</td><td class="dim">' + c.mn + "</td>"
      : "<td class=bl>—</td><td>—</td><td>—</td>";
    grid.forEach(r => {
      /* Empty weekends dim by colour, not tr opacity: a translucent row
         would let scrolled cells ghost through its sticky date cell. */
      wh += '<tr data-we="' + r.we + '" class="' + (r.we === weIdx ? "now " : "") + (r.all ? "" : "mt") + '"' +
        "><td>" + weLabel(r.we) + "</td>" +
        r.per.map((c, i) => leagueBand(c, divsOn[i], r.we)).join("") + allBand(r.all) + "</tr>";
    });
    wt.innerHTML = wh + "</tbody>";
    [...wt.querySelectorAll("tr[data-we]")].forEach(tr =>
      tr.addEventListener("click", () => { weIdx = tr.dataset.we; activeFx = -1; try { localStorage.setItem("tbf-we", weIdx); } catch (e) {} render(); }));
  }
}

svg.addEventListener("click", () => { if (activeFx >= 0) { activeFx = -1; render(); } });
render();
</script>
<script>
  NL.codeGate.ensure({
    mount: document.getElementById("bselGate"),
    title: "Broadcast Travel",
    sub: "Enter your access code.",
    numeric: false,
    length: 6,
    verify: NL.codeGate.viaFunction("app-data/pub-broadcast-selections"),
    claim: "bsel"
  }).then(function (s) {
    document.getElementById("bselGate").remove();
    /* The audience name and sign-out live in the topbar itself, via its
       extras.right slot — a re-render picks them up. No second bar. */
    window.NL_TOOL.extras = { right:
      '<span id="bselTopRight">' +
        '<span id="bselWho">' + NL.escHtml((s && s.name) || "Code holder") + '</span>' +
        '<button id="bselOut" type="button">Sign out</button>' +
      '</span>' };
    NL.renderTopbar(null);
    document.getElementById("bselOut").addEventListener("click", function () {
      NL.codeGate.signOut().then(function () { location.reload(); });
    });
    document.querySelector(".page").hidden = false;
  });
</script>
